[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ur7e-sdk"
version = "0.1.0"
description = "Timestamped UR7e and Robotiq control without ROS"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
hardware = ["ur-rtde>=1.6"]
camera = ["opencv-python>=4.8"]

[project.scripts]
ur7e = "ur7e_sdk.runtime.cli:main"

[tool.setuptools.packages.find]
include = ["ur7e_sdk*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
